[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tariffpeg"
version = "1.0.0"
description = "Guest review evidence pipeline for an accommodation standards unit"
requires-python = ">=3.12"
dependencies = ["click==8.1.8", "httpx==0.28.1"]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "coverage==7.6.10",
  "ruff==0.9.2",
  "mypy==1.14.1",
]

[project.scripts]
tariffpeg = "tariffpeg.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tariffpeg"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "constraints.txt"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RET", "N"]

[tool.ruff.lint.per-file-ignores]
# The names read as sentences where they are raised: `raise NotFound("licence", ref)`
# says more at the call site than `NotFoundError` does.
"src/tariffpeg/errors.py" = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["src/tariffpeg"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
addopts = "--strict-markers --strict-config"
